---
name: Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  NO_AT_BRIDGE: 1  # Necessary for GTK3 interactive test.
  OPENBLAS_NUM_THREADS: 1
  PYTHONFAULTHANDLER: 1
  CI_MONITOR_LOG: /tmp/ci_monitor.tsv

jobs:
  build-cache:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    name: "Build Homebrew cache (${{ matrix.os }})"
    env:
      CACHE_PREFIX: ${{ matrix.os }}-brew-cache-
      CACHE_KEY: ${{ matrix.os }}-brew-cache-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check for existing cache
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(gh cache list --key "$CACHE_PREFIX" --limit 1 --json id --jq length)
          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.check.outputs.exists != 'true'
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Start CPU monitor
        if: steps.check.outputs.exists != 'true'
        run: |
          python -m pip install psutil
          nohup python tools/ci_monitor.py run > /dev/null 2>&1 &
          echo $! > /tmp/ci_monitor.pid
          python tools/ci_monitor.py mark "Clean Runner Image"

      - name: Clean Runner Image
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo mkdir -p /opt/homebrew-aside/Cellar
          sudo mkdir -p /opt/homebrew-aside/Caskroom
          sudo mv /opt/homebrew/Cellar/* /opt/homebrew-aside/Cellar
          sudo mv /opt/homebrew/Caskroom/* /opt/homebrew-aside/Caskroom
          find /opt/homebrew -maxdepth 2 -type l -delete

      - name: Install cache-only packages
        if: steps.check.outputs.exists != 'true'
        run: |
          python tools/ci_monitor.py mark "Install cache-only packages"
          python tools/install_macos_packages.py cache-only

      - name: Prepare /opt/homebrew for cache
        if: steps.check.outputs.exists != 'true'
        run: |
          python tools/ci_monitor.py mark "Prepare /opt/homebrew for cache"
          to_remove=(
            /opt/homebrew/.git
            /opt/homebrew/.github
            /opt/homebrew/completions
            /opt/homebrew/docs
            /opt/homebrew/lib/ruby
            /opt/homebrew/Library/Homebrew
            /opt/homebrew/Library/Taps
            /opt/homebrew/var/cache
            /opt/homebrew/var/homebrew/locks
          )

          sudo mv "${to_remove[@]}" /opt/homebrew-aside

      - name: Report /opt/homebrew size
        if: steps.check.outputs.exists != 'true'
        run: |
          python tools/ci_monitor.py mark "Report /opt/homebrew size"
          sudo du -d 4 -h -I \
            /opt/homebrew 2>/dev/null | sort -rh | head -200

      - name: Save cache
        if: steps.check.outputs.exists != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/homebrew
          key: ${{ env.CACHE_KEY }}

      - name: Stop CPU monitor
        if: always() && steps.check.outputs.exists != 'true'
        run: kill "$(cat /tmp/ci_monitor.pid)" || true

      - name: Upload CPU monitor log
        if: always() && steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-monitor-build-cache-${{ matrix.os }}
          path: ${{ env.CI_MONITOR_LOG }}
          if-no-files-found: ignore
          retention-days: 14

  test:
    needs: build-cache
    if: >-
      !cancelled() &&
      needs.build-cache.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.repository == 'matplotlib/matplotlib' &&
          !contains(github.event.head_commit.message, '[ci skip]') &&
          !contains(github.event.head_commit.message, '[skip ci]') &&
          !contains(github.event.head_commit.message, '[skip github]') &&
          !contains(github.event.head_commit.message, '[ci doc]')
        )
      )
    permissions:
      contents: read
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }} ${{ matrix.name-suffix }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15  # This runner is on M1 (arm64) chips.
            python-version: '3.14'
          - os: macos-26  # This runner is on M1 (arm64) chips.
            python-version: '3.14'
            # https://github.com/matplotlib/matplotlib/issues/29732
            pygobject-ver: '<3.52.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: git describe
        run: |
          git describe

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Start CPU monitor
        run: |
          python -m pip install psutil
          nohup python tools/ci_monitor.py run > /dev/null 2>&1 &
          echo $! > /tmp/ci_monitor.pid
          python tools/ci_monitor.py mark "Restore Homebrew cache"

      - name: Restore Homebrew cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/homebrew
          key: ${{ matrix.os }}-brew-cache
          restore-keys: |
            ${{ matrix.os }}-brew-cache-
          fail-on-cache-miss: true


      - name: Run install_macos_packages.py in the background
        run: |
          python tools/ci_monitor.py mark "install_macos_packages.py (background)"
          (
            python tools/install_macos_packages.py install-all \
              > "$RUNNER_TEMP/install.log" 2>&1 < /dev/null && code=0 || code=$?
            echo "$code" > "$RUNNER_TEMP/install.status.tmp"
            mv "$RUNNER_TEMP/install.status.tmp" "$RUNNER_TEMP/install.status"
          ) > /dev/null 2>&1 < /dev/null &

      - name: Wait for install_macos_packages.py to finish
        timeout-minutes: 5
        run: |
          python tools/ci_monitor.py mark "Wait for install_macos_packages.py"
          while [ ! -f "$RUNNER_TEMP/install.status" ]; do sleep 5; done
          cat "$RUNNER_TEMP/install.log"
          exit "$(cat "$RUNNER_TEMP/install.status")"

      - name: Stop CPU monitor
        if: always()
        run: kill "$(cat /tmp/ci_monitor.pid)" || true

      - name: Upload CPU monitor log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-monitor-test-${{ matrix.os }}
          path: ${{ env.CI_MONITOR_LOG }}
          if-no-files-found: ignore
          retention-days: 1
