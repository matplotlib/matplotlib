---
name: Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  NO_AT_BRIDGE: 1  # Necessary for GTK3 interactive test.
  OPENBLAS_NUM_THREADS: 1
  PYTHONFAULTHANDLER: 1
  CI_MONITOR_LOG: /tmp/ci_monitor.tsv

jobs:
  build-cache:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    name: "Build Homebrew cache (${{ matrix.os }})"
    env:
      CACHE_PREFIX: ${{ matrix.os }}-brew-cache-
      CACHE_KEY: ${{ matrix.os }}-brew-cache-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check for existing cache
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(gh cache list --key "$CACHE_PREFIX" --limit 1 --json id --jq length)
          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export runner info
        run: |
          echo "DELTA_DIR=$RUNNER_TEMP/brew-delta" >> "$GITHUB_ENV"
          echo "DELTA_LOG=$RUNNER_TEMP/brew-delta.log" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.check.outputs.exists != 'true'
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Preserve tools
        if: steps.check.outputs.exists != 'true'
        run: |
          python tools/macos_runner_tool.py preserve-tools

      - name: Snapshot /opt/homebrew
        if: steps.check.outputs.exists != 'true'
        run: python3 tools/macos_snapshot.py snapshot

      - name: Install cache-only packages
        if: steps.check.outputs.exists != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          python tools/macos_runner_tool.py install-all-packages

      - name: Build delta and report
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo mkdir /opt/homebrew-diff
          sudo chown "$(id -un):$(id -gn)" /opt/homebrew-diff
          python3 tools/macos_snapshot.py diff "/opt/homebrew-diff" --log "$DELTA_LOG"

      - name: Upload report
        if: always() && steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: brew-delta-report
          path: ${{ env.DELTA_LOG }}
          if-no-files-found: ignore

      - name: Report /opt/homebrew-diff size
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo du -d 4 -h /opt/homebrew-diff 2>/dev/null | sort -rh | head -200

      - name: Swap delta
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo mv /opt/homebrew /opt/homebrew-aside
          sudo mv /opt/homebrew-diff /opt/homebrew

      - name: Save brew delta
        if: steps.check.outputs.exists != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        env:
          PATH: /usr/local/bin:/usr/bin:/usr/sbin
        with:
          path: /opt/homebrew
          key: ${{ env.CACHE_KEY }}

  test:
    needs: build-cache
    if: >-
      !cancelled() &&
      needs.build-cache.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.repository == 'matplotlib/matplotlib' &&
          !contains(github.event.head_commit.message, '[ci skip]') &&
          !contains(github.event.head_commit.message, '[skip ci]') &&
          !contains(github.event.head_commit.message, '[skip github]') &&
          !contains(github.event.head_commit.message, '[ci doc]')
        )
      )
    permissions:
      contents: read
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }} ${{ matrix.name-suffix }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15  # This runner is on M1 (arm64) chips.
            python-version: '3.14'
          - os: macos-26  # This runner is on M1 (arm64) chips.
            python-version: '3.14'
            # https://github.com/matplotlib/matplotlib/issues/29732
            pygobject-ver: '<3.52.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: git describe
        run: |
          git describe

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            ci/minver-requirements.txt

      - name: Disable unneeded macOS services
        if: false  # startsWith(runner.os, 'macOS')
        run: |
          sudo mdutil -a -i off >/dev/null 2>&1 &
          python tools/macos_runner_tool.py disable-services

      - name: Start CPU monitor
        run: |
          python -m pip install psutil
          nohup python tools/ci_monitor.py run > /dev/null 2>&1 &
          echo $! > /tmp/ci_monitor.pid
          python tools/ci_monitor.py mark "Restore Homebrew cache"

      - name: Clean Homebrew
        run: |
          # Periodically, Homebrew updates Python and fails to overwrite the
          # existing not-managed-by-Homebrew copy without explicitly being told
          # to do so. GitHub/Azure continues to avoid fixing their runner images:
          # https://github.com/actions/runner-images/issues/9966
          # so force an overwrite even if there are no Python updates.
          # We don't even care about Homebrew's Python because we use the one
          # from actions/setup-python.
          for python_package in $(brew list | grep python@); do
            brew unlink ${python_package}
            brew link --overwrite ${python_package}
          done

          # Remove the stale openssl@1.1 symlink present in the macOS 15 runner image
          openssl_link="$(brew --prefix)/bin/openssl"
          case "$(readlink "$openssl_link" 2>/dev/null)" in
            */openssl@1.1/*) rm -f "$openssl_link" ;;
          esac

          # Workaround for https://github.com/actions/runner-images/issues/10984
          brew uninstall --ignore-dependencies --force pkg-config@0.29.2

      - name: Restore Homebrew cache
        if: false
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/homebrew
          key: ${{ matrix.os }}-brew-cache
          restore-keys: |
            ${{ matrix.os }}-brew-cache-
          fail-on-cache-miss: true

      - name: Run macos_runner_tool.py install-all-packages
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          python tools/ci_monitor.py mark "macos_runner_tool.py install-all-packages"
          python tools/macos_runner_tool.py install-all-packages

      - name: Update monitor mark
        run:
          python tools/ci_monitor.py mark "Install Python dependencies"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: startsWith(runner.os, 'Linux')
        with:
          path: ~/.cache/pip
          key: |
            ${{ matrix.os }}-py${{ matrix.python-version }}-pip-${{
            hashFiles('pyproject.toml', 'ci/minver-requirements.txt') }}
          restore-keys: |
            ${{ matrix.os }}-py${{ matrix.python-version }}-pip-
      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: startsWith(runner.os, 'macOS')
        with:
          path: ~/Library/Caches/pip
          key: ${{ matrix.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ matrix.os }}-py${{ matrix.python-version }}-pip-
      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.ccache
          key: ${{ matrix.os }}-py${{ matrix.python-version }}-ccache-${{ hashFiles('src/*') }}
          restore-keys: |
            ${{ matrix.os }}-py${{ matrix.python-version }}-ccache-
      - name: Cache Matplotlib
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/matplotlib
            !~/.cache/matplotlib/tex.cache
            !~/.cache/matplotlib/test_cache
          key: 6-${{ matrix.os }}-py${{ matrix.python-version }}-mpl-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            6-${{ matrix.os }}-py${{ matrix.python-version }}-mpl-${{ github.ref }}-
            6-${{ matrix.os }}-py${{ matrix.python-version }}-mpl-

      - name: Install Python dependencies
        run: |
          printenv

          # Upgrade pip and setuptools and wheel to get as clean an install as
          # possible.
          python -m pip install --upgrade pip setuptools wheel

          # Install pre-release versions during our weekly upcoming dependency tests.
          if [[ "${{ github.event_name }}" == 'schedule'
                && "${{ matrix.name-suffix }}" != '(Minimum Versions)' ]]; then
            PRE="--pre"
          fi

          # Install dependencies from PyPI.
          # Preinstall build requirements to enable no-build-isolation builds.
          python -m pip install --upgrade $PRE --prefer-binary \
            --group build --group test ${{ matrix.extra-requirements }}

          # Install optional dependencies from PyPI.
          # Sphinx is needed to run sphinxext tests
          python -m pip install --upgrade sphinx!=6.1.2

          if [[ "${{ matrix.python-version }}" != 3.*t && "${{ matrix.python-version }}" != 3.15 ]]; then
          # GUI toolkits are pip-installable only for some versions of Python
          # so don't fail if we can't install them.  Make it easier to check
          # whether the install was successful by trying to import the toolkit
          # (sometimes, the install appears to be successful but shared
          # libraries cannot be loaded at runtime, so an actual import is a
          # better check).
          python -m pip install --upgrade pycairo 'cairocffi>=0.8' 'PyGObject${{ matrix.pygobject-ver }}' &&
            (
              python -c 'import gi; gi.require_version("Gtk", "4.0"); from gi.repository import Gtk' &&
              echo 'PyGObject 4 is available' || echo 'PyGObject 4 is not available'
            ) && (
              python -c 'import gi; gi.require_version("Gtk", "3.0"); from gi.repository import Gtk' &&
              echo 'PyGObject 3 is available' || echo 'PyGObject 3 is not available'
            )

          # PyQt5 does not have any wheels for ARM on Linux.
          if [[ "${{ matrix.os }}" != 'ubuntu-24.04-arm' ]]; then
            python -mpip install --upgrade --only-binary :all: pyqt5 &&
              python -c 'import PyQt5.QtCore' &&
              echo 'PyQt5 is available' ||
              echo 'PyQt5 is not available'
          fi
          python -mpip install --upgrade --only-binary :all: pyqt6 &&
            python -c 'import PyQt6.QtCore' &&
            echo 'PyQt6 is available' ||
            echo 'PyQt6 is not available'
          python -mpip install --upgrade --only-binary :all: pyside6 &&
            python -c 'import PySide6.QtCore' &&
            echo 'PySide6 is available' ||
            echo 'PySide6 is not available'

          python -mpip install --upgrade --only-binary :all: \
            -f "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/${{ matrix.os }}" \
            wxPython &&
            python -c 'import wx' &&
            echo 'wxPython is available' ||
            echo 'wxPython is not available'

          fi  # Skip backends on Python 3.*t.

      - name: Install the nightly dependencies
        # Only install the nightly dependencies during the scheduled event
        if: github.event_name == 'schedule' && matrix.name-suffix != '(Minimum Versions)'
        run: |
          python -m pip install pytz tzdata  # Must be installed for Pandas.
          python -m pip install \
            --index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple \
            --upgrade --only-binary=:all: numpy pandas

      - name: Update monitor mark
        run:
          python tools/ci_monitor.py mark "Install Matplotlib"

      - name: Install Matplotlib
        run: |
          ccache -s
          git describe

          # Set flag in a delayed manner to avoid issues with installing other
          # packages
          if [[ "${{ runner.os }}" == 'macOS' ]]; then
            export CPPFLAGS='-fprofile-instr-generate=default.%m.profraw'
            export CPPFLAGS="$CPPFLAGS -fcoverage-mapping"
          else
            export CPPFLAGS='--coverage -fprofile-abs-path -fprofile-update=prefer-atomic'
          fi

          python -m pip install --no-deps --no-build-isolation --verbose \
            --config-settings=setup-args="-DrcParams-backend=Agg" \
            --editable .[dev]

          if [[ "${{ runner.os }}" != 'macOS' ]]; then
            unset CPPFLAGS
          fi

      - name: Update monitor mark
        run:
          python tools/ci_monitor.py mark "Run pytest"

      - name: Clear font cache
        run: |
          rm -rf ~/.cache/matplotlib
        if: matrix.delete-font-cache

      - name: Run pytest
        run: |
          if [[ "${{ matrix.python-version }}" == 3.*t ]]; then
            export PYTHON_GIL=0
          fi
          if [[ "${{ matrix.python-version }}" == 3.15* ]]; then
            export PYTEST_ADDOPTS="-k 'not test_backends_interactive'"
          fi
          pytest -rfEsXR -n auto \
            --maxfail=50 --timeout=300 --durations=25 \
            --cov-report=xml --cov=lib --log-level=DEBUG --color=yes

      - name: Stop CPU monitor
        if: always()
        run: kill "$(cat /tmp/ci_monitor.pid)" || true

      - name: Upload CPU monitor log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-monitor-test-${{ matrix.os }}
          path: ${{ env.CI_MONITOR_LOG }}
          if-no-files-found: ignore
          retention-days: 1
